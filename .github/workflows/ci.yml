name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check app scripts
      - name: Byte-compile sources
        run: python -m compileall -q app scripts
      - name: Validate notebook JSON
        run: python -c "import json; json.load(open('notebooks/main.ipynb', encoding='utf-8')); print('notebook OK')"
      - name: Sensitive-content scan
        run: python scripts/check_sensitive.py
